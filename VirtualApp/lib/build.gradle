plugins {
    id 'com.android.library'
}

android {
    namespace = 'com.lody.virtual'
    compileSdk = 37

    defaultConfig {
        minSdk = 31
        externalNativeBuild {
            ndkBuild {
                abiFilters += ["arm64-v8a", "x86_64"]
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    externalNativeBuild {
        ndkBuild {
            path = file("src/main/jni/Android.mk")
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }
    buildFeatures {
        // 57 .aidl interfaces under src/main/aidl are the core's
        // client/server IPC surface; AGP 8+ compiles AIDL only
        // when asked.
        aidl = true
    }
    lint {
        //IJobService need NewApi
        warning 'NewApi', 'OnClick'
        checkReleaseBuilds = false
        // Or, if you prefer, you can continue to check for errors in release builds,
        // but continue the build even when errors are found:
        abortOnError = false
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    api("me.weishu.exposed:exposed-core:0.8.1") {
        exclude group: 'me.weishu', module: 'free_reflection'
        exclude group: 'me.weishu', module: 'epic'
        exclude group: 'me.weishu.exposed', module: 'exposed-xposedapi'
    }
    implementation "me.weishu:free_reflection:3.0.1"
    implementation "me.weishu:epic:0.11.1"
    implementation "me.weishu.exposed:exposed-xposedapi:0.4.6"
    // Modern hidden-API unsealing for Android 14+: free_reflection
    // loads its helper dex from a writable file in code_cache,
    // which the runtime now refuses (see VirtualCore.startup).
    // HiddenApiBypass uses an in-memory dex instead.
    implementation "org.lsposed.hiddenapibypass:hiddenapibypass:6.2"
}
