# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
# Build in parallel and reuse task outputs across builds (the CI
# workflow caches both the Gradle user home and this build cache).
org.gradle.parallel=true
org.gradle.caching=true
# Each module's R class contains only its own resources (the AGP
# default since 8.0, pinned here so it can't drift).
android.nonTransitiveRClass=true
# This project is built entirely on the legacy support libraries
# (sources import android.support.* throughout). AGP 9 changed
# the useAndroidX default; pin the legacy behavior explicitly —
# Jetifier would rewrite the dependencies to androidx while the
# sources still reference the support packages.
android.useAndroidX=false
