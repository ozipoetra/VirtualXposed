// Top-level build file where you can add configuration options common to all sub-projects/modules.

allprojects {
    repositories {
        mavenLocal()
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
        // Several 2018-era dependencies (SwitchButton,
        // VersionCheckLib, AlipayZeroSdk, the me.weishu libraries,
        // …) were only ever published to JCenter. The read-only
        // archive still serves some of them; Aliyun's mirror of
        // the same archive has the rest (incl. all of me.weishu).
        maven { url 'https://maven.aliyun.com/repository/jcenter' }
        maven { url 'https://jcenter.bintray.com/' }
    }
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}
