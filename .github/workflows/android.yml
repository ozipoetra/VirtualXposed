name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same ref supersedes a run still in flight.
concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out (with submodules)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # setup-gradle restores and saves the Gradle user home
      # (wrapper distribution + dependency cache) and the Gradle
      # build cache between runs — this is what makes repeat
      # builds fast. Pull requests only read the cache, so a PR
      # build can never poison the cache the default branch uses.
      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Build release APKs
        working-directory: VirtualApp
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: VirtualXposed-release-apk
          path: VirtualApp/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
